<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARVEX FC</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --green: #42ff9b;
      --background: #070a0f;
      --card: #111923;
      --border: #293747;
      --text: #f5f7fb;
      --muted: #8d9aaa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 90px;
      background: var(--background);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.5;
      background:
        linear-gradient(#07100ecc, #070a0fee),
        url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1800&q=85")
        center / cover;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px;
      background: #080d14dd;
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #89919e;
    }

    .tag {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 18px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .panel {
      margin: 15px 0;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: linear-gradient(145deg, #141e29ee, #0d131cee);
      box-shadow: 0 12px 35px #0006;
    }

    .hero {
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        linear-gradient(90deg, #07100eee, #07100e55),
        url("https://images.unsplash.com/photo-1581009146145-b5ef050c2e1a?auto=format&fit=crop&w=1500&q=85")
        center / cover;
    }

    .eyebrow {
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(38px, 8vw, 75px);
      font-weight: 900;
    }

    h1 span {
      color: var(--green);
    }

    h2 {
      margin-top: 0;
    }

    .muted {
      color: var(--muted);
    }

    button {
      margin: 4px;
      padding: 12px 16px;
      border: 0;
      border-radius: 13px;
      background: var(--green);
      color: #07100b;
      font-weight: 800;
      cursor: pointer;
    }

    button.alt {
      background: #202d3b;
      color: white;
    }

    .stats,
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #ffffff08;
    }

    .stat b {
      display: block;
      color: var(--green);
      font-size: 27px;
    }

    .progress {
      height: 13px;
      overflow: hidden;
      border-radius: 20px;
      background: #2a3542;
    }

    .fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--green), #a66cff);
      transition: 0.5s;
    }

    .day,
    .meal,
    .medal {
      padding: 17px;
      border: 1px solid #3a495b;
      border-radius: 18px;
      cursor: pointer;
    }

    .green {
      background: #153f2d;
    }

    .orange {
      background: #6b3b17;
    }

    .purple {
      background: #47265f;
    }

    .blue {
      background: #1d4d7e;
    }

    .cyan {
      background: #15565a;
    }

    .red {
      background: #6b2636;
    }

    .yellow {
      background: #66551c;
    }

    .detail {
      margin-top: 15px;
      padding: 20px;
      border: 1px solid var(--green);
      border-radius: 20px;
      background: #09130fdd;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      padding: 10px 4px;
      background: #0b111bef;
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
    }

    .nav button {
      padding: 9px;
      background: transparent;
      color: #b9c4d0;
      font-size: 11px;
    }

    .nav button.active {
      color: var(--green);
    }

    input {
      width: 100%;
      margin: 6px 0;
      padding: 14px;
      border: 1px solid #344457;
      border-radius: 12px;
      background: #0a111a;
      color: white;
    }

    .creator {
      margin: 25px 0;
      color: #778596;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .stats,
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .panel {
        padding: 17px;
      }

      .nav button {
        padding: 8px 6px;
        font-size: 10px;
      }
    }
  </style>
</head>
