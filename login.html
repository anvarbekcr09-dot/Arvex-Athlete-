<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARVEX FC - Kirish</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1><span class="green">ARVEX</span> <span class="gray">FC</span></h1>

<h2>Kirish</h2>

<input id="name" type="text" placeholder="Ismingiz">
<input id="password" type="password" placeholder="Parol">

<button onclick="login()">
🚀 Kirish
</button>

<p style="margin-top:20px;">
Hisobingiz yo'qmi?
<a href="#" style="color:#008cff;">Ro'yxatdan o'tish</a>
</p>

</div>
<script>
function login(){
  const name = document.getElementById("name").value.trim();

  if(name===""){
    alert("Ismingizni kiriting!");
    return;
  }

  localStorage.setItem("name", name);
  window.location.href = "profile.html";
}
</script>
</body>
</html>
