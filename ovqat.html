<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARVEX FC — Ovqatlanish</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="food-page">

  <div class="food-header">
    <div>
      <div class="food-brand">
        <span>ARVEX</span> <b>FC</b>
      </div>
      <small>STRONGER EVERY DAY</small>
    </div>

    <div class="food-label">🍴 OVQAT</div>
  </div>

  <p class="food-subtitle">
    Sog‘lom tana — kuchli kelajak
  </p>

  <!-- 1 HAFTALIK MENYU -->
  <button class="weekly-menu-button" onclick="openWeeklyMenu()">
    <div class="weekly-icon">🍽️</div>
    <div>
      <strong>1 HAFTALIK MENYU</strong>
      <span>Haftalik ovqatlanish rejasini ko‘rish</span>
    </div>
    <b class="arrow">›</b>
  </button>

  <!-- HAFTALIK MENYU -->
  <div id="weeklyMenu" class="weekly-menu">

    <div class="weekly-title">
      <h2>📅 1 haftalik menyu</h2>
      <p>Kerakli kunni tanlang</p>
    </div>

    <div class="day-list">

      <button onclick="showDay(1)" class="day-card green-day">
        🟢 <span>Dushanba</span>
        <b>›</b>
      </button>

      <button onclick="showDay(2)" class="day-card blue-day">
        🔵 <span>Seshanba</span>
        <b>›</b>
      </button>

      <button onclick="showDay(3)" class="day-card purple-day">
        🟣 <span>Chorshanba</span>
        <b>›</b>
      </button>

      <button onclick="showDay(4)" class="day-card yellow-day">
        🟡 <span>Payshanba</span>
        <b>›</b>
      </button>

      <button onclick="showDay(5)" class="day-card green-day">
        🟢 <span>Juma</span>
        <b>›</b>
      </button>

      <button onclick="showDay(6)" class="day-card red-day">
        🔴 <span>Shanba</span>
        <b>›</b>
      </button>

      <button onclick="showDay(0)" class="day-card orange-day">
        🟠 <span>Yakshanba</span>
        <b>›</b>
      </button>

    </div>

    <!-- TANLANGAN KUN -->
    <div id="dayMenu" class="day-menu"></div>

  </div>

</div>


<!-- SAYT YARATUVCHISI -->
<div class="site-creator">
  Sayt yaratuvchisi: <b>Qodirov Anvarbek</b>
</div>


<!-- PASTKI MENYU -->
<div class="bottom-nav">
  <a href="index.html">
    🏠<br><span>Uy</span>
  </a>

  <a href="profile.html">
    💪<br><span>Reja</span>
  </a>

  <a href="ovqat.html" class="active">
    🍽️<br><span>Ovqat</span>
  </a>

  <a href="profile.html">
    👤<br><span>Profil</span>
  </a>
</div>


<script>

const menus = {

1: {
name:"Dushanba",
color:"green",
breakfast:["🥚 Tuxum","🍞 Donli non","🥛 Sut","🍎 Meva"],
lunch:["🍗 Tovuq go‘shti","🍚 Guruch","🥗 Sabzavotli salat"],
dinner:["🐟 Baliq","🥦 Sabzavot","🥗 Yengil salat"]
},

2: {
name:"Seshanba",
color:"blue",
breakfast:["🥣 Suli bo‘tqasi","🍌 Banan","🥛 Yogurt"],
lunch:["🥩 Mol go‘shti","🌾 Grechka","🥗 Salat"],
dinner:["🍗 Tovuq go‘shti","🍚 Guruch","🥒 Bodring va pomidor"]
},

3: {
name:"Chorshanba",
color:"purple",
breakfast:["🥚 Tuxum","🍞 Non","🍐 Meva","🥛 Sut"],
lunch:["🐟 Baliq","🍚 Guruch","🥗 Sabzavot"],
dinner:["🥩 Mol go‘shti","🥔 Kartoshka","🥦 Brokkoli"]
},

4: {
name:"Payshanba",
color:"yellow",
breakfast:["🥣 Suli bo‘tqasi","🍎 Olma","🥛 Yogurt"],
lunch:["🍗 Tovuq go‘shti","🥔 Kartoshka","🥗 Salat"],
dinner:["🐟 Baliq","🍚 Guruch","🥦 Sabzavot"]
},

5: {
name:"Juma",
color:"green",
breakfast:["🥚 Tuxum","🍞 Donli non","🍌 Banan"],
lunch:["🥩 Mol go‘shti","🍚 Guruch","🥗 Salat"],
dinner:["🍗 Tovuq go‘shti","🌾 Grechka","🥒 Sabzavot"]
},

6: {
name:"Shanba",
color:"red",
breakfast:["🥛 Yogurt","🥣 Suli bo‘tqasi","🍓 Meva"],
lunch:["🐟 Baliq","🥔 Kartoshka","🥗 Salat"],
dinner:["🥩 Go‘sht","🍚 Guruch","🥦 Sabzavot"]
},

0: {
name:"Yakshanba",
color:"orange",
breakfast:["🥚 Tuxum + non","🧀 Pishloq","🍎 Meva"],
lunch:["🍗 Tovuq go‘shti","🍝 Makaron yoki guruch","🥗 Salat"],
dinner:["🐟 Baliq yoki go‘sht","🥔 Kartoshka","🥦 Sabzavot"]
}

};


function openWeeklyMenu(){

  const menu = document.getElementById("weeklyMenu");

  menu.classList.toggle("show");

}


function showDay(day){

  const menu = menus[day];

  document.getElementById("dayMenu").innerHTML = `

    <div class="selected-day ${menu.color}">

      <h2>📅 ${menu.name}</h2>

      <div class="food-meal breakfast">
        <div class="meal-top">
          <span>🌅</span>
          <div>
            <h3>Nonushta</h3>
            <small>07:00 — 08:00</small>
          </div>
        </div>

        ${menu.breakfast.map(food =>
          `<p>✓ ${food}</p>`
        ).join("")}

        <label>⚡ Energiya</label>
      </div>


      <div class="food-meal lunch">
        <div class="meal-top">
          <span>☀️</span>
          <div>
            <h3>Tushlik</h3>
            <small>12:30 — 13:30</small>
          </div>
        </div>

        ${menu.lunch.map(food =>
          `<p>✓ ${food}</p>`
        ).join("")}

        <label>💪 Kuch</label>
      </div>


      <div class="food-meal dinner">
        <div class="meal-top">
          <span>🌙</span>
          <div>
            <h3>Kechki ovqat</h3>
            <small>18:30 — 19:30</small>
          </div>
        </div>

        ${menu.dinner.map(food =>
          `<p>✓ ${food}</p>`
        ).join("")}

        <label>🧘 Tinchlik</label>
      </div>

    </div>
  `;

  document.getElementById("dayMenu")
    .scrollIntoView({behavior:"smooth"});

}

</script>

</body>
</html>
